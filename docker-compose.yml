# ============================================================
# Tebarrot - Conferência de Estoque
# Infraestrutura 100% local (galpão) + acesso remoto via Cloudflare Tunnel.
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: tebarrot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./apps/api/migrations:/migrations:ro
    ports:
      # Exposto apenas para localhost para debug local. Nenhuma porta exposta para a rede local externa!
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tebarrot-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: tebarrot-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      API_PORT: ${API_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      DATASET_PATH: ${DATASET_PATH}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      IA_WORKER_URL: ${IA_WORKER_URL}
      IA_WORKER_ENABLED: ${IA_WORKER_ENABLED}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID}
      SHEETS_SYNC_ENABLED: ${SHEETS_SYNC_ENABLED}
      SHEETS_SYNC_INTERVAL_MS: ${SHEETS_SYNC_INTERVAL_MS}
      CLOUDFLARE_ACCESS_ENABLED: ${CLOUDFLARE_ACCESS_ENABLED}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD}
    volumes:
      - dataset:/dataset
    networks:
      - tebarrot-net

  ia-worker:
    build:
      context: ./apps/ia-worker
      dockerfile: Dockerfile
    container_name: tebarrot-ia-worker
    restart: unless-stopped
    profiles: ["v1"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DATASET_PATH: /dataset
      IA_CONFIDENCE_THRESHOLD: ${IA_CONFIDENCE_THRESHOLD:-0.5}
      IA_MIN_IMPROVEMENT: ${IA_MIN_IMPROVEMENT:-0.0}
    volumes:
      - dataset:/dataset
    networks:
      - tebarrot-net

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${EXPO_PUBLIC_API_URL:-https://estoque.puratienda.store}
    container_name: tebarrot-admin-web
    restart: unless-stopped
    environment:
      - VITE_API_URL=${EXPO_PUBLIC_API_URL:-https://estoque.puratienda.store}
    networks:
      - tebarrot-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tebarrot-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - tebarrot-net

  db-backup:
    image: postgres:16-alpine
    container_name: tebarrot-db-backup
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
    volumes:
      - ./backups:/backups
    entrypoint: |
      /bin/sh -c "
        echo '0 3 * * 0 pg_dump -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -F c -f /backups/backup_$(date +\%Y\%m\%d).dump' > /etc/crontabs/root
        crond -f -d 8
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tebarrot-net

networks:
  tebarrot-net:
    driver: bridge

volumes:
  dataset:
