# ============================================================
# Tebarrot - Conferência de Estoque
# Infraestrutura 100% local (galpão) + acesso remoto via Cloudflare Tunnel.
#
# Serviços:
#   - db          : PostgreSQL (fonte única da verdade)
#   - api         : Node.js/Express (regras de negócio, auth, sync Sheets)
#   - ia-worker   : Python/YOLOv8 (V1 - inferência e treino). Desligado por
#                   padrão no V0 (profile "v1").
#
# Túnel de acesso remoto (cloudflared)
# -------------------------------------
# Neste ambiente, o `cloudflared` roda como Serviço nativo do Windows
# (instalado via `cloudflared.exe service install <token>`), não como
# container Docker. Por isso NÃO há serviço `cloudflared` neste compose.
#
# Consequência importante: como o cloudflared roda fora da rede Docker
# `tebarrot-net`, o campo "Service" do Public Hostname no dashboard da
# Cloudflare deve apontar para a porta publicada no HOST, não para o nome
# do serviço Docker:
#
#     Service = http://localhost:3000   (correto — porta publicada pelo `api`)
#     Service = http://api:3000          (ERRADO neste setup — só resolveria
#                                          de dentro da rede tebarrot-net)
#
# Se um dia o cloudflared voltar a rodar em container (join na rede
# tebarrot-net), a URL correta passaria a ser http://api:3000 e a porta
# 3000 do host não precisaria mais estar publicada.
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: tebarrot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./api/migrations:/migrations:ro
    ports:
      # Lado esquerdo = porta no HOST (só usada para acessar o Postgres
      # diretamente da máquina, ex.: psql/DBeaver). Lado direito = porta
      # DENTRO do container, sempre 5432 — é essa que o container `api`
      # usa internamente via rede Docker (POSTGRES_HOST=db), então mudar
      # o lado esquerdo nunca afeta a conexão api -> db.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tebarrot-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: tebarrot-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      API_PORT: ${API_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      DATASET_PATH: ${DATASET_PATH}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      IA_WORKER_URL: ${IA_WORKER_URL}
      IA_WORKER_ENABLED: ${IA_WORKER_ENABLED}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      GOOGLE_PRIVATE_KEY: ${GOOGLE_PRIVATE_KEY}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID}
      SHEETS_SYNC_ENABLED: ${SHEETS_SYNC_ENABLED}
      SHEETS_SYNC_INTERVAL_MS: ${SHEETS_SYNC_INTERVAL_MS}
      CLOUDFLARE_ACCESS_ENABLED: ${CLOUDFLARE_ACCESS_ENABLED}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${CLOUDFLARE_ACCESS_TEAM_DOMAIN}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD}
    volumes:
      - dataset:/dataset
    ports:
      - "3000:3000"
    networks:
      - tebarrot-net

  ia-worker:
    build:
      context: ./ia-worker
      dockerfile: Dockerfile
    container_name: tebarrot-ia-worker
    restart: unless-stopped
    profiles: ["v1"] # só sobe quando explicitamente habilitado (V1)
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DATASET_PATH: /dataset
      IA_CONFIDENCE_THRESHOLD: ${IA_CONFIDENCE_THRESHOLD:-0.5}
      IA_MIN_IMPROVEMENT: ${IA_MIN_IMPROVEMENT:-0.0}
    volumes:
      - dataset:/dataset
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tebarrot-net

networks:
  tebarrot-net:
    driver: bridge

volumes:
  db-data:
  dataset:
